[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poam-generator"
version = "0.6.0"
description = "CLI tool for generating FedRAMP/FISMA Plan of Action & Milestones (POAM) documents"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "openpyxl>=3.1",
    "boto3>=1.26",
    "streamlit>=1.28",
    "pandas>=2.0",
]

[project.scripts]
poam = "poam_generator.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "jsonschema>=4.18",
    "lxml>=4.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # long strings in demo/mock data

[tool.ruff.lint.per-file-ignores]
# Streamlit entry points: import fallbacks for running as a package or a script
"src/poam_generator/dashboard.py" = ["F401", "I001", "E402"]
"streamlit_app.py" = ["I001", "E402"]

[tool.coverage.run]
source = ["poam_generator"]
omit = ["*/dashboard.py"]
